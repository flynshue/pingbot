on:
  pull_request:
  push:
    branches:
      - main

name: Test Deploy Matrix
jobs:
  get-mgmt-cluster:
    runs-on: ubuntu-22.04
    outputs:
      mgmt_clusters: ${{ steps.create-matrix.outputs.matrix }}
    steps:
      - name: git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create matrix of mgmt cluster file names
        id: create-matrix
        run: |
          clusters_array=$(yq '.github' argocd/helm/deploys/*.yaml -o=json -I=0 | jq  --slurp . )
          echo "matrix=$(echo $clusters_array)" >> $GITHUB_OUTPUT
          echo "CLUSTERS_ARRAY: $clusters_array)"
  install:
    needs: [get-mgmt-cluster]
    permissions: 
      id-token: write
      contents: read
    strategy:
      matrix:
        mgmt_cluster: ${{ fromJson(needs.get-mgmt-cluster.outputs.mgmt_clusters) }}
    runs-on: ${{ matrix.mgmt_cluster.runner }}
    steps:
      - name: git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get account Access Token
        run: |
          echo "get access token for account ${{ matrix.mgmt_cluster.account_id }}"

      - name: Auth to cluster
        run: |
          echo "auth to cluster ${{ matrix.mgmt_cluster.mgmt_cluster_name }}"

      - name: Get mmgt cluster
        run: |
          echo "install mgmt cluster ${{ matrix.mgmt_cluster.mgmt_cluster_name }} in ${{ matrix.mgmt_cluster.environment }} --label ${{ matrix.mgmt_cluster.account_id }}"

  get-app-clusters:
    needs: [install, get-mgmt-cluster]
    runs-on: ubuntu-22.04
    outputs:
        ocp_clusters: ${{ steps.create-matrix.outputs.ocp_matrix }}
        eck_clusters: ${{ steps.create-matrix.outputs.eck_matrix }}
        has_ocp: ${{ steps.cluster-types.outputs.has_ocp_clusters}}
        has_eks: ${{ steps.cluster-types.outputs.has_eks_clusters}}
        # has_ocp: true
        # has_eks: false
    steps:
      - name: git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set search criteria
        id: searchString
        run: |
          if [ ${{ github.event.pull_request.draft }} == 'true' ]
          then
            echo "searchString=*sandbox*" >> $GITHUB_OUTPUT
          elif [ ${{ github.event_name }} == 'pull_request' ]
          then
            echo "searchString=*lab*" >> $GITHUB_OUTPUT
          else
            echo "searchString=**" >> $GITHUB_OUTPUT
          fi
      - name: Save changed deploys files
        id: files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c
        with:
          files: |
            argocd/helm/deploys/${{ steps.searchString.outputs.searchString }}.yaml

      - name: Gather application cluster types
        id: cluster-types
        run: |
          echo "has_ocp_clusters=$(yq '.github' -o json | jq '.|has("ocp-clusters")')" >> GITHUB_OUTPUT
          echo "has_eks_clusters=$(yq '.github' -o json | jq '.|has("eks-clusters")')" >> GITHUB_OUTPUT

      - name: Create matrix of cluster file names
        id: create-matrix
        run: |
          ocp_array=$(yq '.github.ocp-clusters[] + .github' ${{ steps.files.outputs.all_changed_files }} -o=json -I=0 | jq  --slurp . )
          echo "ocp_matrix=$(echo $ocp_array)" >> $GITHUB_OUTPUT
          echo "CLUSTERS_ARRAY: $ocp_array)"

          eck_array=$(yq '.github.ocp-clusters[] + .github' ${{ steps.files.outputs.all_changed_files }} -o=json -I=0 | jq  --slurp . )
          echo "ocp_matrix=$(echo $eck_array)" >> $GITHUB_OUTPUT
          echo "CLUSTERS_ARRAY: $eck_array)"

  add-ocp-clusters:
    needs: [get-app-clusters, install]
    if: needs.get-app-clusters.outputs.has_ocp == 'true'
    strategy:
      max-parallel: 1
      matrix:
        app-cluster: ${{ fromJson(needs.get-app-clusters.outputs.ocp_clusters) }}
    runs-on: ${{ matrix.app-cluster.runner }}
    name: Add app cluster ${{ matrix.app-cluster.app_cluster_name }} to argo-cd in ${{ matrix.app-cluster.mgmt_cluster_name }}
    steps:
      - name: git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get app cluster kubeadmin from s3
        id: app-kubeadmin
        run: |
          echo "aws s3 cp s3://${{matrix.app-cluster.s3_bucket}}/auth/kubeadmin-password ."

      - name: add cluster with labels
        run: |
          echo "argocd cluster add --name ${{ matrix.app-cluster.app_cluster_name }}"
          echo "${{ matrix.app-cluster.labels }}"

  add-eck-clusters:
    needs: [get-app-clusters, install]
    if: needs.get-app-clusters.outputs.has_eks == 'true'
    strategy:
      max-parallel: 1
      matrix:
        app-cluster: ${{ fromJson(needs.get-app-clusters.outputs.eck_clusters) }}
    runs-on: ${{ matrix.app-cluster.runner }}
    name: Add app cluster ${{ matrix.app-cluster.app_cluster_name }} to argo-cd in ${{ matrix.app-cluster.mgmt_cluster_name }}
    steps:
      - name: git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: log into eck cluster
        id: app-kubeadmin
        run: |
          echo "aws eck update-kubeconfig --name {{ matrix.app-clusrer.app_cluster_name }}"
